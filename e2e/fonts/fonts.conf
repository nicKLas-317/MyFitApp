<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Polices des tests de bout en bout (version C de l'audit du 5 novembre 2026) : le navigateur des tests ne voit que
  DejaVu Sans, livrée avec les tests, quelle que soit la machine (poste local ou machine d'intégration de GitHub). Les
  contrôles au pixel près (rien ne dépasse, « Démarrer » à l'écran à 320 px…) ne dépendent ainsi plus des polices
  installées (DejaVu Sans Mono pour le texte à chasse fixe). Aucune police du système : un caractère absent de DejaVu Sans (émoji) s'affiche partout de la même façon.
  Déclaré par playwright.config.ts (FONTCONFIG_FILE), tests lancés depuis la racine du dépôt (dossier e2e/fonts) ;
  l'application n'est pas concernée.
-->
<fontconfig>
  <!--
    JAMAIS prefix="relative" (ni un chemin relatif comme « . ») : fontconfig 2.13.1 (le poste de développement) le
    comprend comme le dossier courant, la racine du dépôt, et non comme le dossier de ce fichier ; il parcourt alors
    tout le dépôt, node_modules compris, et écrit un fichier « .uuid » dans chaque dossier (le 5 novembre 2026 : 75
    hors node_modules, 1 296 dedans). prefix="cwd" + e2e/fonts est compris de la même façon par toutes les versions,
    les tests étant lancés depuis la racine du dépôt. La passe de tests échoue si un .uuid apparaît hors de e2e/fonts
    (e2e/uuid-guard.mjs).
  -->
  <dir prefix="cwd">e2e/fonts</dir>
  <cachedir prefix="xdg">myfitapp-tests-fontconfig</cachedir>
  <!--
    Familles génériques seulement : un nom absent (Roboto, Segoe UI, ui-monospace…) est ignoré par le navigateur, qui
    passe au suivant de la pile, comme sur une machine sans cette police. system-ui, sans-serif et les polices par
    défaut du navigateur donnent DejaVu Sans ; monospace donne DejaVu Sans Mono (texte du mail).
  -->
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
